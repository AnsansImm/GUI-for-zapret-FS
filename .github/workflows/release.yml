name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build gui-for-zapret-fs.csproj -c Release -warnaserror
      - name: Verify application
        run: dotnet run --project tests/Verification/Verification.csproj -c Release
      - name: Verify PowerShell scripts
        shell: powershell
        run: ./tests/Verify-Scripts.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify release tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content gui-for-zapret-fs.csproj -Raw
          $expected = 'v' + $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must match project version: $expected" }
      - name: Build portable ZIP
        shell: powershell
        run: ./scripts/build-release.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content gui-for-zapret-fs.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          gh release create $env:GITHUB_REF_NAME `
            "dist/$version/gui-for-zapret-fs-win-x64-portable.zip" `
            "dist/$version/gui-for-zapret-fs-win-x64-portable.zip.sha256" `
            --verify-tag --title "gui-for-zapret-fs $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
